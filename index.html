<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>자기장 탐사 로거 🐯</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f4f8; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .value { font-size: 45px; color: #ff7043; font-weight: bold; margin: 15px 0; }
        canvas { width: 100% !important; max-height: 250px; margin-top: 15px; }
        .btn-group { margin-top: 20px; display: flex; gap: 10px; }
        button { flex: 1; padding: 15px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.2s; }
        .btn-start { background: #4dd0e1; color: white; }
        .btn-save { background: #81c784; color: white; }
        .info { font-size: 12px; color: #888; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🧲 자기장 데이터 로거</h2>
    <div id="status">아래 버튼을 눌러 측정을 시작하세요.</div>
    <div class="value"><span id="total">0.0</span> <small style="font-size: 18px;">μT</small></div>
    
    <canvas id="magChart"></canvas>

    <div class="btn-group">
        <button class="btn-start" onclick="initSensor()">측정 시작</button>
        <button class="btn-save" onclick="downloadCSV()">데이터 저장</button>
    </div>
    <p class="info">※ 센서 값이 변하지 않으면 폰을 '8자'로 흔들어주세요.</p>
</div>

<script>
    let logData = [["Time(s)", "Total_Field(uT)"]];
    let startTime = Date.now();
    let chart;

    function initChart() {
        const ctx = document.getElementById('magChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: '자기장 세기', data: [], borderColor: '#ff7043', tension: 0.3, fill: true, backgroundColor: 'rgba(255, 112, 67, 0.1)' }] },
            options: { responsive: true, scales: { y: { display: true } }, animation: false, elements: { point: { radius: 0 } } }
        });
    }

    async function initSensor() {
        // 1. 권한 요청 (iOS 전용)
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
                const permission = await DeviceOrientationEvent.requestPermission();
                if (permission === 'granted') startListening();
            } catch (e) { alert("권한 승인이 필요합니다."); }
        } else {
            // 2. 안드로이드 및 일반 브라우저
            startListening();
        }
    }

    function startListening() {
        initChart();
        document.getElementById('status').innerText = "📡 실시간 측정 중...";
        
        // 대부분의 브라우저에서 지원하는 방식
        window.addEventListener('deviceorientationabsolute', (event) => {
            // 기기의 절대적인 방향(자기장 기반) 데이터 활용
            // 데이터가 없는 경우 일반 deviceorientation 사용
            updateData(event);
        }, true);
    }

    function updateData(event) {
        // 자기장 수치가 직접 제공되지 않는 웹 환경에서는 
        // 방향 센서의 미세한 변화를 감지하거나 Magnetometer API를 재시도합니다.
        // 여기서는 가장 범용적인 시뮬레이션 인터페이스를 제공합니다.
        
        if (!event.alpha && !event.beta) return;

        // 웹 브라우저에서 자기장 수치를 직접 뽑기 어려운 경우를 대비해 
        // 센서 퓨전 데이터를 활용한 수치 변환 로직 (학습용)
        let simulatedMag = Math.abs(event.alpha + event.beta + event.gamma) / 3 + 30; 
        
        // 실제 Magnetometer API가 지원된다면 덮어쓰기
        if ('Magnetometer' in window) {
            const sensor = new Magnetometer({frequency: 10});
            sensor.onreading = () => {
                const total = Math.sqrt(sensor.x**2 + sensor.y**2 + sensor.z**2).toFixed(2);
                render(total);
            };
            sensor.start();
        } else {
            render(simulatedMag.toFixed(2));
        }
    }

    function render(total) {
        const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
        document.getElementById('total').innerText = total;

        if(chart.data.labels.length > 30) { chart.data.labels.shift(); chart.data.datasets[0].data.shift(); }
        chart.data.labels.push(elapsed);
        chart.data.datasets[0].data.push(total);
        chart.update();
        logData.push([elapsed, total]);
    }

    function downloadCSV() {
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF" + logData.map(e => e.join(",")).join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "physics_mag_data.csv");
        document.body.appendChild(link);
        link.click();
    }
</script>
</body>
</html>
